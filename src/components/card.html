<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>card</title>
  </head>
  <body>
    <article class="card card--{{ cat }}">
      <img
        class="card__img"
        src="assets/images/{{ image }}"
        alt="{{ title }}"
      />

      <a href="{{ catlink }}" class="card__badge">
        <img src="assets/svg/{{ cat }}_default.svg" alt="{{ cat }}" />
      </a>

      <div class="card__content">
        <h3 class="card__title">{{ title }}</h3>
        <p class="card__sub">{{ sub }}</p>
        <p class="card__text">{{ text }}</p>
        <a href="{{ link }}" class="card__cta">Découvrir</a>
      </div>
    </article>
  </body>
</html>
